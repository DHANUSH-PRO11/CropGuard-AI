name: AgroNex CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------------------
  # 1. Backend CI: Dependencies, Syntax, Test Suite & Health Verification
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend Tests & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './backend/requirements.txt'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Syntax & Module Validation
        working-directory: ./backend
        run: |
          python -m py_compile main.py
          python -m py_compile services/ai/disease_detector.py
          python -m py_compile services/agent/agronex_agent.py

      - name: Run Backend Unit Tests
        working-directory: ./backend
        run: |
          python -m unittest discover -s tests -v

      - name: Validate Server Startup & Health Check
        working-directory: ./backend
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 6
          curl -f http://localhost:8000/health || curl -f http://localhost:8000/api/health || exit 1

  # ----------------------------------------------------------------------------
  # 2. Frontend CI: Linting & Production Build
  # ----------------------------------------------------------------------------
  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Linter
        working-directory: ./frontend
        run: npm run lint || true

      - name: Build Production Frontend
        working-directory: ./frontend
        run: npm run build

  # ----------------------------------------------------------------------------
  # 3. Docker CI: Container Image Verification
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Root Dockerfile (Render / Cloud Container)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: agronex-backend:test

  # ----------------------------------------------------------------------------
  # 4. Continuous Deployment (CD): Render & Vercel
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to Production
    needs: [backend-ci, frontend-ci, docker-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Render Deployment via Deploy Hook (optional secret)
      - name: Trigger Render Deploy Hook (Backend)
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render deployment..."
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${RENDER_DEPLOY_HOOK_URL}")
          if [ "$response" -eq 200 ] || [ "$response" -eq 201 ]; then
            echo "Render deploy hook triggered successfully (HTTP $response)."
          else
            echo "Render deploy hook failed with status: $response"
            exit 1
          fi

      # Vercel Deployment via Vercel CLI (optional secrets)
      - name: Deploy to Vercel (Multi-Service)
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "Deploying to Vercel multi-service project..."
          npx vercel --prod --token "${VERCEL_TOKEN}" --yes
